<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ster Dental Clinic</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #00b4d8; /* ڕەنگێکی گونجاو بۆ کلینیکی ددان */
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --text-color: #ffffff;
        }

        body {
            font-family: 'Vazirmatn', sans-serif;
            background-image: url('photo.jpg'); 
            background-size: cover; 
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        /* Overlay بۆ ئەوەی دەقەکان باشتر دیار بن لەسەر باکگراوند */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: -1;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 30px;
            color: #fff;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
            text-align: center;
        }

        .card {
            width: 100%;
            max-width: 400px;
            background: rgba(255, 255, 255, 0.1); 
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .btn-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn {
            display: flex;
            align-items: center;
            padding: 15px 20px;
            border-radius: 15px;
            text-decoration: none;
            color: white;
            font-weight: 500;
            font-size: 16px;
            transition: all 0.3s ease;
            border: 1px solid var(--glass-border);
            background: var(--glass-bg);
        }

        .btn:hover {
            transform: scale(1.03);
            background: rgba(255, 255, 255, 0.2);
        }

        .instagram { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); border: none; }
        .tiktok { background: #000000; }
        .snapchat { background: #FFFC00; color: #000; border: none; }
        .whatsapp { background: #25D366; }
        .phone { background: #007bff; } /* ڕەنگی دوگمەی تەلەفۆن */

        .btn i { font-size: 22px; width: 40px; text-align: center; }
        .btn span { flex-grow: 1; text-align: center; margin-right: -40px; } /* بۆ ڕێکخستنی ناوەڕاست */

        .footer {
            margin-top: 30px;
            font-size: 11px;
            opacity: 0.8;
            letter-spacing: 1px;
            font-family: sans-serif;
        }
    </style>
</head>
<body>

    <h1>Ster Dental Clinic</h1>

    <div class="card">
        <div class="btn-list">
            
            <a href="https://www.instagram.com/ster_dental_clinic?utm_source=qr&igsh=djlwMnlvMndrcWto" class="btn instagram" target="_blank">
                <i class="fab fa-instagram"></i>
                <span>Instagram</span>
            </a>

            <a href="https://www.tiktok.com/@ster.dental.clinic?_r=1&_t=ZS-95yjpYuAUpJ" class="btn tiktok" target="_blank">
                <i class="fab fa-tiktok"></i>
                <span>TikTok</span>
            </a>

            <a href="https://www.snapchat.com/@sterdentalclini?sender_web_id=81053499-a6e7-446a-9e0e-bf1c31d31434&device_type=desktop&is_copy_url=true" class="btn snapchat" target="_blank">
                <i class="fab fa-snapchat"></i>
                <span>Snapchat</span>
            </a>

            <a href="https://wa.me/message/QNYDMN2HL4WOJ1" class="btn whatsapp" target="_blank">
                <i class="fab fa-whatsapp"></i>
                <span>WhatsApp</span>
            </a>

            <a href="tel:07517706941" class="btn phone">
                <i class="fas fa-phone-alt"></i>
                <span>call</span>
            </a>
            
        </div>

        <div class="footer">
            POWERED BY SUNFLOWER WEB
        </div>
    </div>

</body>
</html>
