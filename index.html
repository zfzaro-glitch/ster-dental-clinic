<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ster Dental Clinic</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-gold: #d4af37;
            --glass-bg: rgba(0, 0, 0, 0.4);
            --glass-border: rgba(255, 255, 255, 0.15);
            --text-main: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0f19;
            /* وێنەی باکگراوند لێرە زیاد دەبێت */
            background-image: url('photo.jpg'); 
            background-size: cover; 
            background-position: center center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            margin: 0;
            padding: 20px 0;
            box-sizing: border-box;
        }

        /* بۆ ئەوەی وێنەکە جوان دیار بێت و نوسینەکان بخوێندرێنەوە */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.3); /* سێبەرێکی کەم بۆ باکگراوندەکە */
            z-index: -1;
        }

        .card {
            width: 90%;
            max-width: 400px;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 40px;
            padding: 40px 25px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .logo-img {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            border: 2px solid var(--primary-gold);
            padding: 5px;
            object-fit: cover;
            margin-bottom: 20px;
            background: rgba(255,255,255,0.1);
        }

        .names-container {
            margin-bottom: 10px;
        }

        h1 {
            font-size: 20px;
            margin: 5px 0;
            color: var(--primary-gold);
            letter-spacing: 0.5px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .about-section {
            margin-bottom: 30px;
        }

        .about-text {
            font-size: 14px;
            line-height: 1.8;
            margin: 0;
            color: #e2e8f0;
            opacity: 0.9;
        }

        .btn-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .btn {
            display: flex;
            align-items: center;
            padding: 15px 20px;
            border-radius: 18px;
            text-decoration: none;
            color: white;
            font-weight: 500;
            font-size: 15px;
            transition: all 0.3s ease;
            border: 1px solid var(--glass-border);
            background: rgba(255, 255, 255, 0.08);
            box-sizing: border-box;
        }

        .btn:hover {
            transform: translateY(-3px);
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        /* ڕەنگی سۆشیاڵ میدیاکان */
        .instagram { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); border: none; }
        .tiktok { background: #000000; }
        .snapchat { background: #FFFC00; color: #000; border: none; }
        .whatsapp { background: #25D366; border: none; }
        .call { background: #007bff; border: none; }

        .btn i { font-size: 20px; width: 30px; }
        .btn span { flex-grow: 1; text-align: center; margin-right: -30px; }

        .footer {
            margin-top: 35px;
            font-size: 10px;
            color: rgba(255,255,255,0.5);
            letter-spacing: 2px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- لێرە لۆگۆکەت دابنێ -->
        <img src="logo.jpg" alt="Ster Dental Clinic" class="logo-img">

        <div class="names-container">
            <h1>Dr. Fatima Khalid</h1>
            <h1>Dr. Dilveen Shakir</h1>
        </div>

        <div class="about-section">
            <p class="about-text">
                بەکالوریوس نیشتەرگەریا دەڤ و ددانا<br>
                جوانكاريا ددانا - چاندنا ددانا - راستکرنا ددانا
            </p>
        </div>

        <div class="btn-list">
            
            <a href="https://www.instagram.com/ster_dental_clinic?utm_source=qr&igsh=djlwMnlvMndrcWto" class="btn instagram" target="_blank">
                <i class="fab fa-instagram"></i>
                <span>Instagram</span>
            </a>

            <a href="https://www.tiktok.com/@ster.dental.clinic?_r=1&_t=ZS-95yjpYuAUpJ" class="btn tiktok" target="_blank">
                <i class="fab fa-tiktok"></i>
                <span>TikTok</span>
            </a>

            <a href="https://www.snapchat.com/@sterdentalclini?sender_web_id=81053499-a6e7-446a-9e0e-bf1c31d31434&device_type=desktop&is_copy_url=true" class="btn snapchat" target="_blank">
                <i class="fab fa-snapchat"></i>
                <span>Snapchat</span>
            </a>

            <a href="https://wa.me/message/QNYDMN2HL4WOJ1" class="btn whatsapp" target="_blank">
                <i class="fab fa-whatsapp"></i>
                <span>WhatsApp</span>
            </a>

            <a href="tel:07517706941" class="btn call">
                <i class="fas fa-phone"></i>
                <span>پەیوەندی کردن</span>
            </a>
            
        </div>

        <div class="footer">
            POWERED BY SUNFLOWER WEB
        </div>
    </div>

</body>
</html>
